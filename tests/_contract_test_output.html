
<html>
<head>
<style>
body {
    margin: 0; padding: 0;
    width: 595px; min-height: 842px;
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: #FFFFFF;
}
.card {
    width: 595px; min-height: 842px;
    box-sizing: border-box;
    background: transparent;
}
.contract-header {
    padding: 30px 50px 20px 50px;
    border-bottom: 3px solid #2C3E6B; padding-bottom: 12px;
}
.contract-title {
    font-size: 24px;
    font-weight: 700;
    color: #2C3E6B;
    text-align: center;
    letter-spacing: 2px;
}
.contract-no {
    font-size: 12px;
    color: #7F8C8D;
    text-align: right;
    padding: 0 50px;
    margin-bottom: 20px;
}
.contract-parties {
    padding: 0 50px;
    margin-bottom: 24px;
}
.party-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}
.party-label {
    font-size: 14px;
    font-weight: 600;
    color: #2C3E6B;
    min-width: 50px;
}
.party-name {
    font-size: 14px;
    font-weight: 600;
    color: #2C3E50;
    margin-bottom: 2px;
}
.party-addr {
    font-size: 12px;
    color: #7F8C8D;
}
.contract-divider {
    margin: 0 50px 20px 50px;
    border: none;
    border-top: 1.5px solid #2C3E6B;
}
.contract-terms {
    padding: 0 50px;
    margin-bottom: 24px;
}
.contract-term {
    font-size: 14px;
    line-height: 1.8;
    color: #2C3E50;
    margin-bottom: 8px;
    white-space: pre-wrap;
}
.contract-amount {
    padding: 0 50px;
    margin-bottom: 20px;
    font-size: 15px;
    font-weight: 600;
    color: #2C3E6B;
}
.contract-remark {
    padding: 0 50px;
    margin-bottom: 30px;
    font-size: 13px;
    color: #7F8C8D;
    font-style: italic;
}
.contract-sign {
    padding: 0 50px;
    margin-top: 40px;
}
.sign-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 16px;
}
.sign-block {
    width: 45%%;
}
.sign-label {
    font-size: 13px;
    font-weight: 600;
    color: #2C3E50;
    margin-bottom: 4px;
}
.sign-line {
    border-bottom: 1px solid #7F8C8D;
    height: 36px;
}
.contract-date {
    padding: 0 50px;
    margin-top: 20px;
    font-size: 13px;
    color: #7F8C8D;
    text-align: center;
}
</style>
</head>
<body>
<div class="card">
    <div class="contract-header">
        <div class="contract-title">服务合同</div>
    </div>
    <div class="contract-no">合同编号：HT-2026-001</div>
    <div class="contract-parties">
        <div class="party-row">
            <div>
                <div class="party-label">甲方（委托方）</div>
                <div class="party-name">示例科技有限公司</div>
                <div class="party-addr">北京市朝阳区xx路1号</div>
            </div>
            <div style="text-align:right;">
                <div class="party-label">乙方（受托方）</div>
                <div class="party-name">客户企业有限公司</div>
                <div class="party-addr">上海市浦东新区xx路2号</div>
            </div>
        </div>
    </div>
    <hr class="contract-divider">
    <div class="contract-terms"><div class="contract-term">第一条  双方应严格遵守本合同约定。</div><div class="contract-term">第二条  服务内容详见附件A。</div><div class="contract-term">第三条  付款方式：合同签订后7日内支付50%预付款。</div><div class="contract-term">第五条  因履行本合同发生的争议，提交北京仲裁委员会仲裁。</div></div>
    <div class="contract-amount">合同金额：¥100,000.00</div>
    <div class="contract-remark">本合同自双方签字盖章之日起生效。</div>
    <div class="contract-sign">
        <div class="sign-row">
            <div class="sign-block">
                <div class="sign-label">甲方签章：</div>
                <div class="sign-line"></div>
            </div>
            <div class="sign-block">
                <div class="sign-label">乙方签章：</div>
                <div class="sign-line"></div>
            </div>
        </div>
    </div>
    <div class="contract-date">2026年6月3日</div>
</div>
</body>
</html>
